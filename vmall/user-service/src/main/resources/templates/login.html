<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="vi">
<head>
    <title>VMall - Đăng Nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.5s ease-out;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="h-screen overflow-hidden relative bg-gradient-to-br from-blue-100 via-white to-purple-100">
    <!-- Background pattern -->
    <div class="fixed inset-0 z-0 opacity-20">
        <div class="absolute inset-0 bg-gradient-to-r from-blue-400 to-purple-500"></div>
        <div class="absolute inset-0 bg-grid-slate-100 [mask-image:linear-gradient(0deg,white,rgba(255,255,255,0.6))]"
             style="background-size: 20px 20px;"></div>
    </div>

    <!-- Login container -->
    <div class="relative z-10 h-screen flex items-center justify-center px-4">
        <div class="glass-effect p-8 rounded-2xl shadow-2xl w-full max-w-md animate-fadeIn">
            <!-- Logo and Title -->
            <div class="text-center mb-8">
                <div class="inline-block p-3 rounded-full bg-gradient-to-r from-blue-500 to-purple-600 text-white mb-4">
                    <i class="fas fa-shopping-bag text-3xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Chào mừng đến VMall</h2>
                <p class="text-gray-600">Đăng nhập vào tài khoản của bạn</p>
            </div>

            <!-- Error Messages -->
            <div th:if="${param.error}"
                 class="mb-4 p-4 bg-red-50 border border-red-100 rounded-lg flex items-center space-x-2 text-red-700">
                <i class="fas fa-exclamation-circle"></i>
                <p class="font-medium">Tên đăng nhập hoặc mật khẩu không đúng.</p>
            </div>
            <div th:if="${param.logout}"
                 class="mb-4 p-4 bg-green-50 border border-green-100 rounded-lg flex items-center space-x-2 text-green-700">
                <i class="fas fa-check-circle"></i>
                <p class="font-medium">Bạn đã đăng xuất thành công.</p>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="space-y-6">
                <div class="group">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-user"></i>
                        </div>
                        <input type="text" name="username"
                               class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-lg text-sm
                                      placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                                      hover:border-gray-300 transition-colors duration-200"
                               placeholder="Nhập tên đăng nhập"/>
                    </div>
                </div>

                <div class="group">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" name="password"
                               class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-lg text-sm
                                      placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                                      hover:border-gray-300 transition-colors duration-200"
                               placeholder="Nhập mật khẩu"/>
                    </div>
                </div>

                <button type="submit"
                        class="w-full flex justify-center items-center space-x-2 py-2.5 px-4 border border-transparent
                               rounded-lg text-sm font-medium text-white bg-gradient-to-r from-blue-600 to-purple-600
                               hover:from-blue-700 hover:to-purple-700 focus:outline-none focus:ring-2
                               focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200 transform
                               hover:scale-[1.02] active:scale-[0.98]">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Đăng nhập</span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
