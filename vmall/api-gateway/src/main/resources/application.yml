server:
  port: 8888

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Mall Service Routes
        - id: mall-service
          uri: lb://mall-service
          predicates:
            - Path=/mall/**
          filters:
            - RewritePath=/mall/(?<segment>.*), /$\{segment}


eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVER}
